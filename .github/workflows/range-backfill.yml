name: Range ETF Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date (YYYY-MM-DD)
        required: true
        type: string
      end_date:
        description: End date (YYYY-MM-DD); use same date for a single-day backfill
        required: true
        type: string
      exchange:
        description: Exchange to backfill
        required: true
        default: ALL
        type: choice
        options:
          - ALL
          - SSE
          - SZSE
      force:
        description: Re-fetch and UPSERT existing dates
        required: true
        default: true
        type: boolean
      no_upload:
        description: Archive only; do not upload to PostgreSQL
        required: true
        default: false
        type: boolean
      min_delay_seconds:
        description: Minimum delay between trading days
        required: true
        default: "20"
        type: string
      max_delay_seconds:
        description: Maximum delay between trading days
        required: true
        default: "40"
        type: string

permissions:
  contents: write

concurrency:
  group: etf-data-writer
  cancel-in-progress: false

jobs:
  range-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate inputs and build trading-day list
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python <<'PY'
          import os
          from datetime import date
          import akshare as ak

          start = date.fromisoformat(os.environ["START_DATE"])
          end = date.fromisoformat(os.environ["END_DATE"])
          if end < start:
              raise SystemExit("end_date must not be earlier than start_date")
          if (end - start).days > 90:
              raise SystemExit("Range is limited to 90 calendar days")

          calendar = ak.tool_trade_date_hist_sina()
          days = sorted(
              d.isoformat()
              for d in calendar["trade_date"].tolist()
              if start <= d <= end
          )
          if not days:
              raise SystemExit("No trading days found in the requested range")

          with open("/tmp/trading-days.txt", "w", encoding="utf-8") as handle:
              handle.write("\n".join(days) + "\n")

          print(f"Trading days: {len(days)}")
          print("\n".join(days))
          PY

      - name: Run range backfill
        env:
          ETF_API_URL: ${{ secrets.ETF_API_URL }}
          ETF_API_TOKEN: ${{ secrets.ETF_API_TOKEN }}
          EXCHANGE: ${{ inputs.exchange }}
          FORCE: ${{ inputs.force }}
          NO_UPLOAD: ${{ inputs.no_upload }}
          MIN_DELAY: ${{ inputs.min_delay_seconds }}
          MAX_DELAY: ${{ inputs.max_delay_seconds }}
        run: |
          python <<'PY'
          import os
          import random
          import subprocess
          import sys
          import time

          days = [line.strip() for line in open("/tmp/trading-days.txt", encoding="utf-8") if line.strip()]
          exchange = os.environ["EXCHANGE"]
          force = os.environ["FORCE"].lower() == "true"
          no_upload = os.environ["NO_UPLOAD"].lower() == "true"
          min_delay = int(os.environ["MIN_DELAY"])
          max_delay = int(os.environ["MAX_DELAY"])

          if min_delay < 0 or max_delay < min_delay or max_delay > 300:
              raise SystemExit("Invalid delay range")

          successes = []
          failures = []

          for index, trade_date in enumerate(days, start=1):
              print("=" * 64, flush=True)
              print(f"[{index}/{len(days)}] {trade_date} | exchange={exchange}", flush=True)
              print("=" * 64, flush=True)

              command = [
                  sys.executable, "-m", "src.main",
                  "--date", trade_date,
                  "--exchange", exchange,
              ]
              if force:
                  command.append("--force")
              if no_upload:
                  command.append("--no-upload")

              result = subprocess.run(command, check=False)
              if result.returncode == 0:
                  successes.append(trade_date)
                  print(f"{trade_date}: SUCCESS", flush=True)
              else:
                  failures.append((trade_date, result.returncode))
                  print(f"{trade_date}: FAILED (exit {result.returncode})", flush=True)

              if index < len(days):
                  delay = random.randint(min_delay, max_delay)
                  print(f"Sleeping {delay}s before next trading day...", flush=True)
                  time.sleep(delay)

          print("=" * 64)
          print("RANGE BACKFILL SUMMARY")
          print("=" * 64)
          print(f"Exchange     : {exchange}")
          print(f"Trading days : {len(days)}")
          print(f"Success      : {len(successes)}")
          print(f"Failed       : {len(failures)}")

          if failures:
              print("Failed dates:")
              for day, code in failures:
                  print(f"  {day} (exit code {code})")
              raise SystemExit(1)
          PY

      - name: Commit backfilled data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: ${{ inputs.exchange }} range backfill ${{ inputs.start_date }} to ${{ inputs.end_date }} [skip ci]"
            git stash push --include-untracked --message "range-backfill-runtime" || true
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Purge Cloudflare ETF read API cache
        if: ${{ !inputs.no_upload }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request

          zone_id = os.environ["CLOUDFLARE_ZONE_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          endpoint = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/purge_cache"
          payload = {
              "prefixes": [
                  "etf-api.mydomain.xyz/api/v1/dashboard/",
                  "etf-api.mydomain.xyz/api/v1/rankings",
                  "etf-api.mydomain.xyz/api/v1/etf/",
              ]
          }
          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)
          print(json.dumps(result, ensure_ascii=False))
          if result.get("success") is not True:
              raise SystemExit("Cloudflare prefix purge failed")
          print("CLOUDFLARE PREFIX PURGE: SUCCESS")
          PY
