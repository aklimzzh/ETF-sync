name: Daily ETF Import

on:
  schedule:
    - cron: '16 16 * * 1-5'
    - cron: '35 22 * * 1-5'
    - cron: '7 23 * * 1-5'
  workflow_dispatch:
    
permissions:
  contents: write

concurrency:
  group: etf-data-writer
  cancel-in-progress: false

jobs:
  import-etf:
    name: Import ETF Data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ETF_API_URL: ${{ secrets.ETF_API_URL }}
      ETF_API_TOKEN: ${{ secrets.ETF_API_TOKEN }}

    steps:
      - name: Show trigger information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC time:"
          date -u
          echo "Shanghai time:"
          TZ=Asia/Shanghai date

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show ETF importer options
        run: python -m src.main --help

      - name: Fetch, validate, archive and import
        run: python -m src.main --allow-not-ready

      - name: Commit new data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "No new data files."
          else
            git commit -m "data: update ETF shares [skip ci]"
            git stash push --include-untracked --message "daily-etf-runtime" || true
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Purge Cloudflare ETF read API cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ETF_API_DOMAIN: ${{ secrets.ETF_API_DOMAIN }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request

          zone_id = os.environ["CLOUDFLARE_ZONE_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          domain = os.environ["ETF_API_DOMAIN"]
          endpoint = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/purge_cache"
          payload = {
              "prefixes": [
                  f"etf-api.{domain}/api/v1/dashboard/",
                  f"etf-api.{domain}/api/v1/rankings",
                  f"etf-api.{domain}/api/v1/etf/",
              ]
          }
          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)
          print(json.dumps(result, ensure_ascii=False))
          if result.get("success") is not True:
              raise SystemExit("Cloudflare prefix purge failed")
          print("CLOUDFLARE PREFIX PURGE: SUCCESS")
          PY
