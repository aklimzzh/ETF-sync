name: Daily Market Import

on:
  schedule:
    - cron: "43 6 * * 2-6"   # 北京时间周二~周六 06:43
      timezone: "Asia/Shanghai"
    - cron: "22 7 * * 2-6"   # 北京时间周二~周六 07:22
      timezone: "Asia/Shanghai"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-writer
  cancel-in-progress: false

jobs:

  import-etf:
    name: Import ETF Data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ETF_API_URL: ${{ secrets.ETF_API_URL }}
      ETF_API_TOKEN: ${{ secrets.ETF_API_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:

      - name: Show trigger information
        run: |
          echo "Job: ETF Import"
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"

          echo "UTC time:"
          date -u

          echo "Shanghai time:"
          TZ=Asia/Shanghai date

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show ETF importer options
        run: |
          python -m src.main --help

      - name: Fetch, validate, archive and import ETF data
        run: |
          python -m src.main --allow-not-ready

      - name: Commit new ETF data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new data files."
          else
            git commit -m "data: update ETF shares [skip ci]"

            git stash push \
              --include-untracked \
              --message "daily-market-runtime" \
              || true

            git pull --rebase origin "${GITHUB_REF_NAME}"

            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi


  import-index:
    name: Import Market Index Data
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ETF_API_URL: ${{ secrets.ETF_API_URL }}
      ETF_API_TOKEN: ${{ secrets.ETF_API_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:

      - name: Show trigger information
        run: |
          echo "Job: Index Import"
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"

          echo "UTC time:"
          date -u

          echo "Shanghai time:"
          TZ=Asia/Shanghai date

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show dependency versions
        run: |
          python --version
          python -c "import akshare; print('AKShare:', akshare.__version__)"
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import requests; print('requests:', requests.__version__)"

      - name: Check required environment variables
        run: |
          python - <<'PY'
          import os

          required = (
              "ETF_API_URL",
              "ETF_API_TOKEN",
          )

          missing = [
              name
              for name in required
              if not os.environ.get(name, "").strip()
          ]

          if missing:
              raise SystemExit(
                  "Missing required environment variables: "
                  + ", ".join(missing)
              )

          print("Required environment variables are configured.")
          PY

      - name: Fetch and import index data
        run: |
          python -m src.sync_index_daily


  purge-cache:
    name: Purge Cloudflare API Cache
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - import-etf
      - import-index

    # Purge if at least one import job succeeded.
    # This also allows cache refresh if one data source failed
    # but the other successfully updated its database records.
    if: |
      always() &&
      (
        needs.import-etf.result == 'success' ||
        needs.import-index.result == 'success'
      )

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      ETF_API_DOMAIN: ${{ secrets.ETF_API_DOMAIN }}

    steps:

      - name: Show import results
        run: |
          echo "ETF job:   ${{ needs.import-etf.result }}"
          echo "Index job: ${{ needs.import-index.result }}"

      - name: Purge Cloudflare read API cache
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          zone_id = os.environ["CLOUDFLARE_ZONE_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          domain = os.environ["ETF_API_DOMAIN"]

          endpoint = (
              "https://api.cloudflare.com/client/v4/zones/"
              f"{zone_id}/purge_cache"
          )

          prefixes = [
              f"etf-api.{domain}/api/v1/dashboard/",
              f"etf-api.{domain}/api/v1/rankings",
              f"etf-api.{domain}/api/v1/etf/",
              f"etf-api.{domain}/api/v1/index/",
          ]

          payload = {
              "prefixes": prefixes
          }

          print("Purging:")
          for prefix in prefixes:
              print(f"  {prefix}")

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(
              request,
              timeout=30,
          ) as response:
              result = json.load(response)

          print(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2,
              )
          )

          if result.get("success") is not True:
              raise SystemExit(
                  "Cloudflare prefix purge failed"
              )

          print("CLOUDFLARE PREFIX PURGE: SUCCESS")
          PY


  summary:
    name: Daily Market Import Summary
    runs-on: ubuntu-latest

    needs:
      - import-etf
      - import-index
      - purge-cache

    if: always()

    steps:

      - name: Show final status
        run: |
          echo "========================================"
          echo "Daily Market Import"
          echo "========================================"
          echo "ETF import:   ${{ needs.import-etf.result }}"
          echo "Index import: ${{ needs.import-index.result }}"
          echo "Cache purge:  ${{ needs.purge-cache.result }}"
          echo "========================================"

          if [ "${{ needs.import-etf.result }}" != "success" ]; then
            echo "ETF import did not complete successfully."
            exit 1
          fi

          if [ "${{ needs.import-index.result }}" != "success" ]; then
            echo "Index import did not complete successfully."
            exit 1
          fi

          if [ "${{ needs.purge-cache.result }}" != "success" ]; then
            echo "Cloudflare cache purge did not complete successfully."
            exit 1
          fi

          echo "DAILY MARKET IMPORT: SUCCESS"
