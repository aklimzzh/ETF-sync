name: Manual ETF Backfill

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Target trade date (YYYY-MM-DD)"
        required: true
        type: string
      no_upload:
        description: "Archive only; do not upload to Serv00"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: manual-etf-backfill-${{ inputs.trade_date }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ETF_API_URL: ${{ secrets.ETF_API_URL }}
      ETF_API_TOKEN: ${{ secrets.ETF_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate input date
        run: python -c "from datetime import date; date.fromisoformat('${{ inputs.trade_date }}')"

      - name: Run backfill with upload
        if: ${{ !inputs.no_upload }}
        run: python -m src.main --date "${{ inputs.trade_date }}" --force

      - name: Run archive-only backfill
        if: ${{ inputs.no_upload }}
        run: python -m src.main --date "${{ inputs.trade_date }}" --force --no-upload

      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data files."
          else
            git commit -m "data: backfill ETF shares for ${{ inputs.trade_date }} [skip ci]"
            git push
          fi
