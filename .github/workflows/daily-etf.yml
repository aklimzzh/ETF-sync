name: Daily ETF Import

on:
  workflow_dispatch:
  schedule:
    - cron: "16 21 * * 1-5"
    - cron: "46 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-etf-import
  cancel-in-progress: false

jobs:
  import-etf:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ETF_API_URL: ${{ secrets.ETF_API_URL }}
      ETF_API_TOKEN: ${{ secrets.ETF_API_TOKEN }}

    steps:
      - name: Show trigger information
        run: |
          echo "========================================"
          echo "Daily ETF Import"
          echo "========================================"
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo
          echo "UTC time:"
          date -u
          echo
          echo "Shanghai time:"
          TZ=Asia/Shanghai date
          echo "========================================"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show ETF importer options
        run: |
          python -m src.main --help

      - name: Fetch, validate, archive and import
        run: |
          python -m src.main --allow-not-ready

      - name: Commit new data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new data files."
          else
            git commit \
              -m "data: update ETF shares [skip ci]"

            # Protect against another data workflow having pushed
            # while this run was executing.
            git stash push \
              --include-untracked \
              --message "daily-etf-runtime" || true

            git pull \
              --rebase \
              origin \
              "${GITHUB_REF_NAME}"

            git push \
              origin \
              "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Purge Cloudflare ETF API cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          echo "=== Purge Cloudflare ETF API Cache ==="

          response=$(curl \
            --fail \
            --show-error \
            --silent \
            --request POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{
              "prefixes": [
                "etf-api.mydomain.xyz/api/v1/dashboard/",
                "etf-api.mydomain.xyz/api/v1/rankings",
                "etf-api.mydomain.xyz/api/v1/etf/"
              ]
            }')

          echo "$response"

          echo "$response" | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          if data.get("success") is not True:
              raise SystemExit(
                  "Cloudflare cache purge failed"
              )

          print("CLOUDFLARE CACHE PURGE: SUCCESS")
          '
