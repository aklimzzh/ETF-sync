name: Daily ETF Import

on:
  schedule:
    - cron: "36 21 * * 0-4" # Shanghai 05:36 Mon-Fri
    - cron: "36 22 * * 0-4" # Shanghai 06:36 Mon-Fri, compensation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-etf-import
  cancel-in-progress: false

jobs:
  import-etf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ETF_API_URL: ${{ secrets.ETF_API_URL }}
      ETF_API_TOKEN: ${{ secrets.ETF_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, validate, archive and import
        run: python -m src.main --allow-not-ready

      - name: Commit new data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data files."
          else
            git commit -m "data: update ETF shares [skip ci]"
            git push
          fi
