      - name: Test authenticated database write
        env:
          ETF_API_URL: ${{ secrets.ETF_API_URL }}
          ETF_API_TOKEN: ${{ secrets.ETF_API_TOKEN }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          python3 <<'PY'
          import json
          import os

          body = {
              "source": "github-api-test",
              "message": (
                  "GitHub Actions database write test. "
                  f"Run ID: {os.environ['GITHUB_RUN_ID_VALUE']}"
              ),
          }

          with open(
              "/tmp/write-request.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(body, f)
          PY

          curl \
            --fail \
            --show-error \
            --silent \
            --request POST \
            --header \
              "Authorization: Bearer $ETF_API_TOKEN" \
            --header \
              "Content-Type: application/json" \
            --data @/tmp/write-request.json \
            "$ETF_API_URL/api/v1/test" \
            -o /tmp/write-response.json

          cat /tmp/write-response.json
          echo

          python3 <<'PY'
          import json

          with open(
              "/tmp/write-response.json",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          assert data["success"] is True
          assert data["committed"] is True
          assert data["verified"] is True

          record = data["record"]

          assert record["source"] == "github-api-test"

          print("DATABASE WRITE TEST: SUCCESS")
          print(f"Inserted ID: {record['id']}")
          print(f"Message: {record['message']}")
          print(f"Created: {record['created_at']}")
          PY
